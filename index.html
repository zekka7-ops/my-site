<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年収の壁・手取りシミュレーター</title>
    <!-- Tailwind CSS (デザイン用) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (安定性を重視してv17に変更) -->
    <script crossorigin src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (翻訳機) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Prop Types (Rechartsの依存関係) -->
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    
    <!-- Recharts (グラフ描画用: CDNで安定するバージョンを指定) -->
    <script src="https://unpkg.com/recharts@2.5.0/umd/Recharts.js"></script>

    <style>
        body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend, ResponsiveContainer } = Recharts;

        // アイコンの代わりに絵文字を使用（依存関係削減のため）
        const Icons = {
            Calculator: () => <span className="text-2xl">🧮</span>,
            Alert: () => <span className="text-xl">⚠️</span>,
            Money: () => <span className="text-2xl">💰</span>,
            Trend: () => <span className="text-2xl">📈</span>,
            Info: () => <span className="text-xl">ℹ️</span>
        };

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-xl shadow-lg overflow-hidden ${className}`}>
                {children}
            </div>
        );

        const App = () => {
            const [hourlyWage, setHourlyWage] = useState(1150);
            const [hoursPerWeek, setHoursPerWeek] = useState(20);
            const [isSocialInsured, setIsSocialInsured] = useState(false);

            const [result, setResult] = useState({
                annualIncome: 0,
                current: { tax: 0, social: 0, net: 0 },
                proposed: { tax: 0, social: 0, net: 0 },
            });

            useEffect(() => {
                calculate();
            }, [hourlyWage, hoursPerWeek, isSocialInsured]);

            const calculate = () => {
                const annualIncome = hourlyWage * hoursPerWeek * 52;
                
                let socialInsurance = 0;
                if (annualIncome >= 1300000 || (isSocialInsured && annualIncome >= 1060000)) {
                    socialInsurance = annualIncome * 0.144; 
                }

                // 現行 (103万壁)
                const currentTaxable = Math.max(0, annualIncome - 1030000 - socialInsurance);
                const currentTax = currentTaxable * 0.05;
                const residentTax = annualIncome > 1000000 ? (Math.max(0, annualIncome - 1000000) * 0.1) + 5000 : 0;
                const currentTotalTax = currentTax + residentTax;
                const currentNet = annualIncome - socialInsurance - currentTotalTax;

                // 新案 (178万壁)
                const proposedTaxable = Math.max(0, annualIncome - 1780000 - socialInsurance);
                const proposedTax = proposedTaxable * 0.05;
                const proposedResidentTax = annualIncome > 1780000 ? (Math.max(0, annualIncome - 1780000) * 0.1) + 5000 : 0;
                const proposedTotalTax = proposedTax + proposedResidentTax;
                const proposedNet = annualIncome - socialInsurance - proposedTotalTax;

                setResult({
                    annualIncome,
                    current: { tax: currentTotalTax, social: socialInsurance, net: currentNet },
                    proposed: { tax: proposedTotalTax, social: socialInsurance, net: proposedNet },
                });
            };

            const formatCurrency = (val) => {
                return new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY', maximumFractionDigits: 0 }).format(val);
            };

            const chartData = [
                {
                    name: '現行(103万)',
                    手取り: result.current.net,
                    税金: result.current.tax,
                    社会保険料: result.current.social,
                },
                {
                    name: '新案(178万)',
                    手取り: result.proposed.net,
                    税金: result.proposed.tax,
                    社会保険料: result.proposed.social,
                },
            ];

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-4xl mx-auto space-y-6">
                    
                    <header className="text-center space-y-2 mb-8">
                        <div className="inline-flex items-center justify-center p-3 bg-blue-100 rounded-full mb-2">
                            <Icons.Calculator />
                        </div>
                        <h1 className="text-3xl font-bold text-slate-900">「年収の壁」手取りシミュレーター</h1>
                        <p className="text-slate-500 font-medium">103万円 vs 178万円案、あなたの手取りはどう変わる？</p>
                    </header>

                    <Card className="p-6 border border-slate-200">
                        <div className="grid md:grid-cols-2 gap-8">
                            <div className="space-y-6">
                                <h2 className="text-lg font-bold flex items-center gap-2 text-slate-700">
                                    <Icons.Alert /> 勤務条件を入力
                                </h2>
                                
                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-600 mb-1">時給 (円)</label>
                                        <input 
                                            type="range" min="1000" max="3000" step="10" 
                                            value={hourlyWage} 
                                            onChange={(e) => setHourlyWage(parseInt(e.target.value))}
                                            className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                        />
                                        <div className="flex justify-between mt-2">
                                            <input 
                                                type="number" value={hourlyWage} 
                                                onChange={(e) => setHourlyWage(parseInt(e.target.value))}
                                                className="w-24 p-2 border rounded text-right font-bold text-lg"
                                            />
                                            <span className="text-slate-400 self-center">円</span>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-sm font-semibold text-slate-600 mb-1">週の労働時間</label>
                                        <input 
                                            type="range" min="1" max="60" step="1" 
                                            value={hoursPerWeek} 
                                            onChange={(e) => setHoursPerWeek(parseInt(e.target.value))}
                                            className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                        />
                                        <div className="flex justify-between mt-2">
                                            <span className="text-2xl font-bold text-blue-600">{hoursPerWeek} <span className="text-sm text-slate-500 font-normal">時間/週</span></span>
                                        </div>
                                    </div>

                                    <div className="bg-orange-50 p-4 rounded-lg border border-orange-100">
                                        <label className="flex items-start gap-3 cursor-pointer">
                                            <input 
                                                type="checkbox" 
                                                checked={isSocialInsured} 
                                                onChange={(e) => setIsSocialInsured(e.target.checked)}
                                                className="mt-1 w-5 h-5 accent-blue-600"
                                            />
                                            <div className="text-sm">
                                                <span className="font-bold text-slate-800 block">社会保険(106万の壁) 対象？</span>
                                                <span className="text-slate-500 text-xs">従業員51人以上、週20時間以上など</span>
                                            </div>
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div className="bg-slate-900 text-white rounded-xl p-6 flex flex-col justify-center space-y-6 relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-32 bg-blue-500 rounded-full blur-3xl opacity-20 -mr-16 -mt-16"></div>
                                
                                <div>
                                    <p className="text-slate-400 text-sm mb-1">推定年収（額面）</p>
                                    <p className="text-4xl font-bold tracking-tight">{formatCurrency(result.annualIncome)}</p>
                                </div>

                                <div className="pt-4 border-t border-slate-700">
                                    <p className="text-slate-400 text-sm mb-2">手取り額の比較（年間）</p>
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <span className="text-xs text-slate-400 block">現行 (103万壁)</span>
                                            <span className="text-xl font-bold text-slate-200">{formatCurrency(result.current.net)}</span>
                                        </div>
                                        <div>
                                            <span className="text-xs text-yellow-400 block font-bold">新案 (178万壁)</span>
                                            <span className="text-2xl font-bold text-yellow-400">{formatCurrency(result.proposed.net)}</span>
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-slate-800 rounded p-3 text-center">
                                    <span className="text-sm text-slate-300">差額: </span>
                                    <span className="text-lg font-bold text-green-400">+{formatCurrency(result.proposed.net - result.current.net)}</span>
                                </div>
                            </div>
                        </div>
                    </Card>

                    <Card className="p-6">
                        <h3 className="text-lg font-bold mb-6 text-slate-700">手取り・税金・社会保険料の内訳比較</h3>
                        <div className="h-64 w-full">
                            <ResponsiveContainer width="100%" height="100%">
                                <BarChart
                                    data={chartData}
                                    layout="vertical"
                                    margin={{ top: 5, right: 30, left: 20, bottom: 5 }}
                                >
                                    <CartesianGrid strokeDasharray="3 3" horizontal={true} vertical={false} />
                                    <XAxis type="number" hide />
                                    <YAxis dataKey="name" type="category" width={80} tick={{fontSize: 12}} />
                                    <Tooltip 
                                        formatter={(value) => formatCurrency(value)}
                                        contentStyle={{ borderRadius: '8px', border: 'none', boxShadow: '0 4px 12px rgba(0,0,0,0.1)' }}
                                    />
                                    <Legend />
                                    <Bar dataKey="手取り" stackId="a" fill="#3b82f6" radius={[0, 0, 0, 0]} />
                                    <Bar dataKey="社会保険料" stackId="a" fill="#f97316" />
                                    <Bar dataKey="税金" stackId="a" fill="#ef4444" radius={[0, 4, 4, 0]} />
                                </BarChart>
                            </ResponsiveContainer>
                        </div>
                        
                        <div className="mt-4 p-4 bg-yellow-50 border border-yellow-200 rounded-lg flex gap-3 items-start">
                            <Icons.Info />
                            <div className="text-sm text-yellow-800">
                                <p className="font-bold mb-1">ここがポイント</p>
                                <p>
                                    年収が130万円（または106万円）を超えると、<strong>社会保険料（オレンジ色）</strong>が大きく発生します。
                                    「税金の壁」がなくなっても、「社会保険の壁」で手取りが減るゾーンに注意してください。
                                </p>
                            </div>
                        </div>
                    </Card>

                    <footer className="text-center text-xs text-slate-400 py-8">
                        <p className="mb-2">※本シミュレーションは2026年時点の概算および改正案に基づく試算です。</p>
                        <p>&copy; 2026 Salary Wall Simulator</p>
                    </footer>
                </div>
            );
        };

        // React 17用のレンダリングコードに変更
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
